<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Finance Tracker — Dashboard</title>
<meta name="theme-color" content="#0B0E14" />
<meta name="robots" content="noindex, nofollow" />
<script>
  (function() {
    var saved = localStorage.getItem('ft_theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="sidebarScrim" class="sidebar-scrim"></div>
    <div class="main-col">
      <div id="pageHeader" class="header"></div>
      <div class="container">

        <div class="card-grid" id="summaryCards"></div>
        <div class="card-grid" id="diversityCards"></div>

        <div class="card">
          <div class="card-head"><span class="eyebrow">Allocation by asset class</span></div>
          <div class="card-body">
            <div style="display:flex; gap:28px; flex-wrap:wrap; align-items:center;">
              <div id="donutHolder"></div>
              <div style="flex:1; min-width:260px;" id="allocTableHolder"></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><span class="eyebrow">Top holdings by weight</span></div>
          <div class="card-body" id="topHoldingsHolder"></div>
        </div>

        <div class="card">
          <div class="card-head"><span class="eyebrow">Holdings — current value &amp; XIRR</span></div>
          <div class="table-scroll">
            <table id="holdingsTable">
              <thead>
                <tr>
                  <th>Name</th><th>Class</th><th>Qty</th><th>Invested</th><th>Current</th>
                  <th>Gain</th><th>Gain %</th><th>XIRR</th>
                </tr>
              </thead>
              <tbody id="holdingsBody"></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><span class="eyebrow">Invested vs current — by asset class</span></div>
          <div class="card-body">
            <div class="chart-box" id="barChart"></div>
          </div>
        </div>

        <div class="footer-note">Finance Tracker · data source: data/data.json · not investment advice</div>
      </div>
    </div>
  </div>
  <nav id="bottomNav" class="bottom-nav"></nav>

  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/market.js"></script>
  <script src="js/valuation.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>

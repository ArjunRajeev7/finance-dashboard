<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Finance Tracker — Indian Stocks</title>
<meta name="theme-color" content="#0B0E14" />
<meta name="robots" content="noindex, nofollow" />
<script>
  (function() {
    var saved = localStorage.getItem('ft_theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="sidebarScrim" class="sidebar-scrim"></div>
    <div class="main-col">
      <div id="pageHeader" class="header"></div>
      <div class="container">

        <div class="card-grid" id="summaryCards"></div>

        <div class="card">
          <div class="card-head"><span class="eyebrow">Allocation within Indian Stocks</span></div>
          <div class="card-body" style="display:flex; gap:24px; flex-wrap:wrap; align-items:center;">
            <div id="allocHolder"></div>
            <div id="allocLegend" style="flex:1; min-width:200px;"></div>
          </div>
        </div>

        <div class="card" id="addFrame"></div>
        <div class="card" id="tableFrame"></div>

        <div class="footer-note">Finance Tracker · data source: data/data.json · not investment advice</div>
      </div>
    </div>
  </div>
  <nav id="bottomNav" class="bottom-nav"></nav>

  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/market.js"></script>
  <script src="js/valuation.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/stocklike.js"></script>
  <script>
    (async () => {
      await Store.init();
      renderShell('stocks-ind.html', 'Indian Stocks');
      renderStockLikePage('IN_STOCK');
    })();
    window.addEventListener('ft-store-updated', () => renderStockLikePage('IN_STOCK'));
    window.addEventListener('ft-prices-updated', () => renderStockLikePage('IN_STOCK'));
    window.addEventListener('ft-theme-changed', () => renderStockLikePage('IN_STOCK'));
  </script>
</body>
</html>

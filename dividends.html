<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Finance Tracker — Dividends</title>
<meta name="theme-color" content="#0B0E14" />
<meta name="robots" content="noindex, nofollow" />
<script>
  (function() {
    var saved = localStorage.getItem('ft_theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div id="sidebarScrim" class="sidebar-scrim"></div>
    <div class="main-col">
      <div id="pageHeader" class="header"></div>
      <div class="container">

        <div class="card-grid" id="summaryCards"></div>

        <div class="card" id="addFrame">
          <div class="card-head">
            <span class="eyebrow">Log a dividend</span>
            <button class="ghost" id="importDivBtn" style="font-size:12px;">Import CSV/Excel</button>
          </div>
          <div class="card-body">
            <div class="form-grid">
              <div class="form-field"><label>Asset type</label>
                <select id="divAssetType">
                  <option value="IN_STOCK">Indian Stock</option>
                  <option value="US_STOCK">US Stock</option>
                </select>
              </div>
              <div class="form-field"><label>Symbol</label><input id="divSymbol" placeholder="e.g. RELIANCE" /></div>
              <div class="form-field"><label>Date</label><input id="divDate" type="date" /></div>
              <div class="form-field"><label id="divAmountLabel">Amount (₹)</label><input id="divAmount" type="number" step="any" /></div>
              <div class="form-field"><label>Notes (optional)</label><input id="divNotes" placeholder="e.g. interim dividend" /></div>
              <div class="form-field"><button id="addDivBtn" class="primary">+ Add</button></div>
            </div>
          </div>
        </div>

        <div class="card" id="tableFrame"></div>

        <div class="card">
          <div class="card-head"><span class="eyebrow">Yearly breakdown</span></div>
          <div class="card-body" id="yearlyHolder"></div>
        </div>

        <div class="footer-note">Finance Tracker · data source: data/data.json · not investment advice · USD dividends shown in INR use the current USD/INR rate, not the historical rate on the payment date</div>
      </div>
    </div>
  </div>
  <nav id="bottomNav" class="bottom-nav"></nav>

  <script src="js/icons.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/store.js"></script>
  <script src="js/finance.js"></script>
  <script src="js/market.js"></script>
  <script src="js/valuation.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/dividends.js"></script>
</body>
</html>
